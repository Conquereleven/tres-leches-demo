name: WebKit catalog recovery diagnostic (TPL-16)
# Temporary, isolated diagnostic for TPL-16. Disposable SQLite and loopback fixtures only.
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/storefront-dynamic-e2e/**"
      - "src/brand/**"
      - ".github/workflows/webkit-catalog-diagnostic.yml"
permissions:
  contents: read
concurrency:
  group: webkit-catalog-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  webkit-catalog:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instrumented scenario, 20 repetitions per width
        run: npx playwright test --config playwright.storefront-dynamic.config.ts --project=webkit tests/storefront-dynamic-e2e/catalog-recovery-diagnostic.spec.ts --repeat-each=20 --retries=0 --reporter=line
      - name: Catalog loading, recovery, layout stability and no-fallback cases, 20 repetitions per width
        run: npx playwright test --config playwright.storefront-dynamic.config.ts --project=webkit tests/storefront-dynamic-e2e/media-loading.spec.ts --repeat-each=20 --retries=0 --reporter=line
