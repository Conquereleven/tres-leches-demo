name: Analytics isolated browser validation
on:
  pull_request:
    branches: [main]
    paths:
      - "server/analytics/**"
      - "src/commerce/Analytics.tsx"
      - "src/commerce/analytics.css"
      - "src/commerce/Workspace.tsx"
      - "src/commerce/api.ts"
      - "src/commerce/ops-i18n.tsx"
      - "src/commerce/locales/**"
      - "tests/analytics-e2e/**"
      - "tests/fixtures/analytics*"
      - "playwright.analytics.config.ts"
      - ".github/workflows/analytics.yml"
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  analytics-browsers:
    runs-on: ubuntu-24.04
    # Preinstalled browser dependencies prevent apt mirror stalls and runner OS drift.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-webkit-runtime.mjs
      - run: openssl version
      - run: npx playwright test --config=playwright.analytics.config.ts --reporter=list
      # Disposable synthetic SQLite; no secrets, provider requests or deployment.
      - if: failure()
        name: Synthetic failure context
        run: |
          python3 - <<'PYLOG'
          from pathlib import Path
          for path in Path('test-results/analytics').rglob('error-context.md'):
              print(path)
              print(path.read_text())
          PYLOG
