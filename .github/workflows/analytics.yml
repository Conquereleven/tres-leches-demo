name: Analytics isolated browser validation
on:
  pull_request:
    branches: [main]
    paths:
      - "server/analytics/**"
      - "src/commerce/**"
      - "tests/analytics-e2e/**"
      - "tests/fixtures/analytics*"
      - "playwright.analytics.config.ts"
      - ".github/workflows/analytics.yml"
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  analytics-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.analytics.config.ts
      # Disposable synthetic SQLite; no secrets, provider requests or deployment.
