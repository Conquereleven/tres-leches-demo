name: Personalized packs regression
on:
  pull_request:
    branches: [main]
    paths:
      - "shared/pack-*.ts"
      - "server/**"
      - "src/brand/**"
      - "src/commerce/**"
      - "tests/**"
      - "playwright*.ts"
      - ".github/workflows/personalized-packs.yml"
permissions:
  contents: read
concurrency:
  group: packs-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  packs-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/verify-webkit-runtime.mjs
      - run: node --import tsx scripts/preview-kitchen-email.ts
      - run: npx playwright test --config=playwright.email.config.ts
      - run: node --import tsx scripts/preview-pack-pricing.ts
      - run: npx playwright test --config=playwright.premium.config.ts
      - run: node --import tsx scripts/preview-tricolor.ts
      - run: npx playwright test --config=playwright.tricolor.config.ts
      - run: mkdir -p work/e2e
      - run: npx playwright test --config=playwright.packs.config.ts
      - run: npx playwright test --config=playwright.checkout.config.ts --browser=chromium
      - run: npx playwright test --config=playwright.checkout.config.ts --browser=webkit
      - run: npx playwright test --config=playwright.product-hub.config.ts
      - run: npx playwright test --config=playwright.storefront-dynamic.config.ts
      - if: failure()
        name: Synthetic browser failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('test-results').rglob('error-context.md'):
              print(str(p))
              print(p.read_text())
          PY
      - if: failure()
        name: Retain synthetic browser traces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packs-browser-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Loopback fixtures, disposable SQLite and in-process fake provider only.
      # No secrets, remote data, deployment or provider network requests.
  operations-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'webkit'
        run: node scripts/verify-webkit-runtime.mjs
      - run: mkdir -p work/e2e
      - name: Compare main WebKit navigation under the same runner conditions
        if: matrix.browser == 'webkit'
        # Diagnostic baseline only; its result is retained explicitly below.
        # The candidate's complete suite remains an unconditional release gate.
        run: |
          baseline=$(mktemp -d)
          git archive "${{ github.event.pull_request.base.sha }}" | tar -x -C "$baseline"
          cp playwright.operations.config.ts "$baseline/playwright.operations.config.ts"
          mkdir -p work/qa/navigation-baseline
          set +e
          (cd "$baseline" && npm ci && npx playwright install webkit && DEBUG=pw:browser npx playwright test --config=playwright.operations.config.ts --project=webkit --grep 'fulfilment actions|address, verification' --repeat-each=5 --trace=on) > work/qa/navigation-baseline/main.log 2>&1
          result=$?
          set -e
          echo "$result" > work/qa/navigation-baseline/exit-code.txt
          cp -R "$baseline/test-results" work/qa/navigation-baseline/ || true
          cat work/qa/navigation-baseline/main.log
      - name: Complete candidate Operations regression
        env:
          DEBUG: pw:browser
        run: /usr/bin/time -v npx playwright test --config=playwright.operations.config.ts --project=${{ matrix.browser }}
      - if: failure()
        name: Synthetic Operations failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('test-results/operations').rglob('error-context.md'):
              print(str(p))
              print(p.read_text())
          PY
      - if: always()
        name: Retain Operations diagnostics and baseline comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-diagnostics-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results/operations/
            work/qa/navigation-baseline/
          retention-days: 7
          if-no-files-found: ignore
      # Same 92 Operations scenarios, split 46 per engine on isolated runners.
      # No timeout increase, skipped assertions, credentials or external providers.
