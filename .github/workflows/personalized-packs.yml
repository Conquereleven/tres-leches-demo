name: Personalized packs regression
on:
  pull_request:
    branches: [main]
    paths:
      - "shared/pack-*.ts"
      - "server/**"
      - "src/brand/**"
      - "src/commerce/**"
      - "tests/**"
      - "playwright*.ts"
      - ".github/workflows/personalized-packs.yml"
permissions:
  contents: read
concurrency:
  group: packs-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  packs-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: mkdir -p work/e2e
      - run: npx playwright test --config=playwright.packs.config.ts
      - run: npx playwright test --config=playwright.checkout.config.ts --browser=chromium
      - run: npx playwright test --config=playwright.checkout.config.ts --browser=webkit
      - run: npx playwright test --config=playwright.product-hub.config.ts
      - run: npx playwright test --config=playwright.operations.config.ts
      # Loopback fixtures, disposable SQLite and in-process fake provider only.
      # No secrets, remote data, deployment or provider network requests.
