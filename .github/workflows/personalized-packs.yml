name: Personalized packs regression
on:
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - "server/**"
      - "src/brand/**"
      - "tests/**"
      - "playwright*.ts"
      - ".github/workflows/personalized-packs.yml"
permissions:
  contents: read
concurrency:
  group: packs-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  packed-v32:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-webkit-runtime.mjs
      - name: Real V3.2 personalized packs, settled order, kitchen, authorization
        run: npx playwright test --config=playwright.packs.config.ts --project=${{ matrix.project }} --reporter=list
      - if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v32-packs-failure-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/packs/
          retention-days: 7
          if-no-files-found: ignore
  tricolor-v32:
    runs-on: ubuntu-24.04
    # Same preinstalled runtime already validated by both packed-v32 jobs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-webkit-runtime.mjs
      - run: node --import tsx scripts/preview-tricolor.ts
      - run: npx playwright test --config=playwright.tricolor.config.ts --reporter=list
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v32-tricolor-failure-${{ github.run_attempt }}
          path: test-results/tricolor/
          retention-days: 7
          if-no-files-found: ignore
  pricing-email:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-webkit-runtime.mjs
      - run: node --import tsx scripts/preview-kitchen-email.ts
      - run: node --import tsx scripts/preview-pack-pricing.ts
      - run: npx playwright test --config=playwright.email.config.ts
      - run: npx playwright test --config=playwright.premium.config.ts
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v32-pack-email-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  # Independent Commerce/Checkout/Operations/V3.2 workflows retain their gates.
