name: Operations mobile regression
on:
  pull_request:
    branches: [main]
    paths:
      - "src/commerce/**"
      - "src/brand/Root.tsx"
      - "src/brand/Shop.tsx"
      - "src/brand/checkout.css"
      - "server/**"
      - "shared/**"
      - "tests/operations-e2e/**"
      - "tests/fixtures/**"
      - "playwright.operations.config.ts"
      - ".github/workflows/operations-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  operations-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'webkit'
        run: node scripts/verify-webkit-runtime.mjs
      - run: mkdir -p work/e2e
      - name: Complete candidate Operations regression
        env:
          DEBUG: pw:browser
        run: /usr/bin/time -v npx playwright test --config=playwright.operations.config.ts --project=${{ matrix.browser }}
      - if: failure()
        name: Synthetic Operations failure context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('test-results/operations').rglob('error-context.md'):
              print(str(p))
              print(p.read_text())
          PY
      - if: failure()
        name: Retain Operations failure diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-diagnostics-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results/operations/
          retention-days: 7
          if-no-files-found: ignore
      # Same 92 Operations scenarios, split 46 per engine on isolated runners.
      # No timeout increase, skipped assertions, credentials or external providers.
