name: SEO release readiness
on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "src/brand/**"
      - "tests/**"
      - "playwright*.ts"
      - ".github/workflows/seo-readiness.yml"
permissions:
  contents: read
concurrency:
  group: seo-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  seo-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.storefront-dynamic.config.ts
      # Disposable SQLite, loopback fixtures and fake providers only. No deploy.
