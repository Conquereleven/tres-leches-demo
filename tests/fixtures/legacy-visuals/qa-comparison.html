<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #1e1c1a;
        color: white;
        font: 600 14px system-ui;
      }
      .labels {
        height: 44px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        text-align: center;
        letter-spacing: 0.12em;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
      }
      .compare img {
        display: block;
        width: 100%;
        height: auto;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="labels">
      <span>FUENTE VISUAL · OPCIÓN 1</span><span>IMPLEMENTACIÓN · HOME</span>
    </div>
    <div class="compare">
      <img src="/assets/source-option-1.png" /><img
        src="/assets/implementation-home-final.png"
      />
    </div>
  </body>
</html>
